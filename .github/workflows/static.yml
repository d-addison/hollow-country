name: Source and tooling validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preland:
    name: Required preland and hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # regenerate_all compares historical committed loot inputs.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shared Windows-free preland profile
        run: python3 -B -m tools.validate.preland --profile ci
      - name: Repository hygiene
        if: always()
        run: python3 -B -m tools.validate.hygiene
  tooling-tests:
    name: Python tooling unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tooling behavior
        run: python3 -B -m unittest discover -s tests/unit -v
  automation-offline:
    name: Offline validation framework (standard library only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Catalogue, feature, binding and driver graph integrity
        run: python3 -B -m tools.validate.automation_drift
      - name: Framework unit tests
        run: >-
          python3 -B -m unittest -v
          tests.unit.test_bdd_bindings
          tests.unit.test_automation
          tests.unit.test_automation_runner
          tests.unit.test_artifact_store
          tests.unit.test_coverage_report
          tests.unit.test_s002_integrity
          tests.unit.test_runtime_settings
          tests.unit.test_atmosphere
          tests.unit.test_stamina_transport_probe
# Native package PowerShell tests need an installed DayZ/Workshop stack, which
# GitHub-hosted runners do not have. Native package/compile/boot/release checks
# remain local lead gates. Legacy source pins and the broad nightly/BDD suite
# are removed: offline tests cannot establish DayZ behavior.
