name: Specification or scope change
description: Track a decision and its effects on the complete project.
title: "[spec] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Desired behavior and motivation
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: Affected requirements, tasks and milestones
      description: Link spec/plan/ADR updates and prerequisite evidence; preserve deferred requirements.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and validation
      description: Given/When/Then, failing test, native feasibility, multiplayer, performance and rollback as applicable.
    validations:
      required: true
