# Banso v2 configuration
# Generated by `banso setup`

schema_version: 1
project_name: "hollow-country"
workflow: hollow-country
profile: default

routing:
  default_tier: standard
  deescalation_window: 3

budget:
  on_exceed: warn

tdd:
  enabled: true
  scope: per_task

methodology:
  enabled: [sdd, bdd, tdd]
  order: [sdd, bdd, tdd]
  strict: true

# Detected project type: Unknown

# Sol 6.1 workers for Hollow Country (copied from /code/banso dispatch.codex-sol; no fallback model)
execution:
  profiles:
    dispatch.codex-sol:
      backends:
        codex:
          provider: openai
          auth: { kind: cli_sso }
      models:
        quick: { backend: codex, model: gpt-6.1-sol }
        standard: { backend: codex, model: gpt-6.1-sol }
        deep: { backend: codex, model: gpt-6.1-sol }
      repositories:
        primary:
          path: .
          mount: primary
          role: primary
          authority: read_write
          source: { kind: snapshot, digest: unpinned }
          target_branch: unpinned
          expected_target_head: unpinned
      workspace_authority:
        execute_processes: true
        use_tools: true
        use_vault_references: false
        provider_push: false
      sandbox: { mode: workspace_write, required: true }
      egress: { mode: unrestricted, risk_acknowledged: true }
      actions: { default: allow, destructive: confirm, sensitive: confirm }
      retention:
        download_outputs_before_cleanup: true
        archive_on_completion: false
        delete_on_completion: false
      data_policy:
        require_zdr: false
        require_hipaa_baa: false
        allow_sensitive_data: false
        sensitive_data_risk_acknowledged: false
      max_concurrency: 6
      budget: {}

# Project-specific endpoint; service env also protects against higher-layer defaults.
daemon:
  port: 9746

# Schema: banso-engine reaction::{ReactionConfig, ReactionRule, EventFilter}.
reactions:
  max_concurrent_reactions: 1
  rules:
    - id: dayz-update-friction
      name: DayZ update available
      trigger: {source: dayz-update, kind: dayz_update, tags: []}
      action:
        type: emit_friction
        event_type: dayz_update
        message: 'DayZ update available: review .banso/pipeline-outputs/dayz-update/check.json and pending.md'
      cooldown_secs: 0
      dry_run: false
      approval_required: false
      enabled: true
